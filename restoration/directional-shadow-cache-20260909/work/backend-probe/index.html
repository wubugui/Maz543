<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>MAZ 显示后端可用性检查</title>
<style>body{font:16px system-ui;margin:32px;background:#172024;color:#eef3ed}button{padding:12px}pre{white-space:pre-wrap}canvas{width:256px;height:256px;border:1px solid #748379}</style>
<h1>显示后端可用性检查</h1>
<p>独立探针：仅请求浏览器公开的 WebGPU 接口并绘制 64 × 64、4 倍采样三角形。结果不代表整车兼容性或性能。</p>
<button id="run">检查 WebGPU</button><p><canvas width="64" height="64" aria-label="WebGPU 三角形"></canvas></p>
<pre aria-label="后端检查结果" id="result">未运行</pre>
<script type="module">
const button=document.querySelector('#run'),output=document.querySelector('#result');
button.onclick=async()=>{
  button.disabled=true;
  const report={secureContext:isSecureContext,webgpu:!!navigator.gpu,attempts:[],status:'running'};
  const show=()=>output.textContent=JSON.stringify(report,null,2);
  let device,context;
  const resources=[];
  show();
  try{
    if(!navigator.gpu){report.status='api-unavailable';return;}
    let adapter;
    for(const options of [{},{powerPreference:'high-performance'}]){
      adapter=await navigator.gpu.requestAdapter(options);
      report.attempts.push({options,available:!!adapter});
      show();
      if(adapter)break;
    }
    if(!adapter){report.status='adapter-unavailable';return;}
    const info=adapter.info;
    report.adapter=Object.fromEntries(['vendor','architecture','device','description','isFallbackAdapter'].map(k=>[k,info?.[k]??null]));
    report.features=[...adapter.features].sort();
    device=await adapter.requestDevice();
    const uncaptured=[];
    device.addEventListener('uncapturederror',event=>uncaptured.push(event.error.message));
    device.pushErrorScope('validation');
    const shader=device.createShaderModule({code:`
      @vertex fn vs(@builtin(vertex_index) i:u32)->@builtin(position) vec4f {
        var p=array<vec2f,3>(vec2f(0.0,0.8),vec2f(-0.8,-0.8),vec2f(0.8,-0.8));
        return vec4f(p[i],0.5,1.0);
      }
      @fragment fn fs()->@location(0) vec4f {return vec4f(0.0,1.0,0.0,1.0);}
    `});
    const pipeline=await device.createRenderPipelineAsync({layout:'auto',vertex:{module:shader,entryPoint:'vs'},
      fragment:{module:shader,entryPoint:'fs',targets:[{format:'rgba8unorm'}]},multisample:{count:4},
      depthStencil:{format:'depth24plus',depthWriteEnabled:true,depthCompare:'less'}});
    const color=device.createTexture({size:[64,64],format:'rgba8unorm',sampleCount:4,usage:GPUTextureUsage.RENDER_ATTACHMENT});
    const depth=device.createTexture({size:[64,64],format:'depth24plus',sampleCount:4,usage:GPUTextureUsage.RENDER_ATTACHMENT});
    const resolved=device.createTexture({size:[64,64],format:'rgba8unorm',usage:GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.COPY_SRC});
    const read=device.createBuffer({size:64*256,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
    resources.push(color,depth,resolved,read);
    const encoder=device.createCommandEncoder();
    const pass=encoder.beginRenderPass({colorAttachments:[{view:color.createView(),resolveTarget:resolved.createView(),
      clearValue:{r:0,g:0,b:0,a:1},loadOp:'clear',storeOp:'discard'}],depthStencilAttachment:{view:depth.createView(),depthClearValue:1,depthLoadOp:'clear',depthStoreOp:'discard'}});
    pass.setPipeline(pipeline);pass.draw(3);pass.end();
    encoder.copyTextureToBuffer({texture:resolved},{buffer:read,bytesPerRow:256},[64,64]);
    device.queue.submit([encoder.finish()]);
    await read.mapAsync(GPUMapMode.READ);
    const pixels=new Uint8Array(read.getMappedRange()).slice();read.unmap();
    const center=[...pixels.slice((32*64+32)*4,(32*64+32)*4+4)];
    const corner=[...pixels.slice(0,4)];
    context=document.querySelector('canvas').getContext('2d');
    context.putImageData(new ImageData(new Uint8ClampedArray(pixels),64,64),0,0);
    report.validationError=(await device.popErrorScope())?.message??null;
    report.uncapturedErrors=uncaptured;
    report.render={size:[64,64],samples:4,depth:'depth24plus',center,corner};
    report.status=JSON.stringify(center)==='[0,255,0,255]'&&JSON.stringify(corner)==='[0,0,0,255]'&&!report.validationError&&!uncaptured.length?'triangle-pass':'triangle-failed';
  }catch(error){report.status='failed';report.error=String(error?.stack??error);}
  finally{
    for(const resource of resources)resource.destroy();
    device?.destroy();
    report.resourcesReleased=true;
    show();button.disabled=false;
  }
};
</script></html>
